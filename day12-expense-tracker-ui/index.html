<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker - Day 12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>💰 Expense Tracker</h1>
      <div class="total-display">
        <span>Total Spending</span>
        <h2 id="totalAmount">Rp 0</h2>
      </div>
    </header>

    <!-- Add Expense Form -->
    <section class="add-expense">
      <h2>Add New Expense</h2>
      <form id="expenseForm">
        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">-- Select Category --</option>
              <option value="food">🍔 Food</option>
              <option value="transport">🚗 Transport</option>
              <option value="entertainment">🎬 Entertainment</option>
              <option value="bills">💡 Bills</option>
              <option value="shopping">🛍️ Shopping</option>
              <option value="health">⚕️ Health</option>
              <option value="other">📦 Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="amount">Amount (Rp)</label>
            <input type="number" id="amount" min="0" step="1000" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g., Lunch at cafe" required>
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Add Expense</button>
      </form>
    </section>

    <!-- Filters -->
    <section class="filters">
      <div class="filter-group">
        <label>Filter by Category:</label>
        <select id="filterCategory">
          <option value="all">All Categories</option>
          <option value="food">🍔 Food</option>
          <option value="transport">🚗 Transport</option>
          <option value="entertainment">🎬 Entertainment</option>
          <option value="bills">💡 Bills</option>
          <option value="shopping">🛍️ Shopping</option>
          <option value="health">⚕️ Health</option>
          <option value="other">📦 Other</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Filter by Month:</label>
        <select id="filterMonth">
          <option value="all">All Time</option>
          <!-- Will be populated with months -->
        </select>
      </div>
    </section>

    <!-- Budget Summary -->
    <section class="budget-summary" id="budgetSummary">
      <h2>Monthly Budget</h2>
      <div class="budget-grid" id="budgetGrid">
        <!-- Budget items will be added here -->
      </div>
    </section>

    <!-- Expenses Table -->
    <section class="expenses-section">
      <div class="section-header">
        <h2>Recent Expenses</h2>
        <button id="clearAll" class="btn btn-danger">Clear All</button>
      </div>
      
      <div class="table-container">
        <table class="expenses-table" id="expensesTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expensesBody">
            <!-- Expenses will be added here -->
          </tbody>
        </table>
      </div>

      <div class="empty-state" id="emptyState">
        <p>📊 No expenses yet. Add one above to get started!</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
